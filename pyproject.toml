
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pavao"
version = "0.8.6"
description = "Modular, injection based ASGI web framework"
authors = [
	{ name = "Gustavo Venturini", email = "gustavo.c.venturini@gmail.com" }
]
requires-python = ">=3.6"
dependencies = [
	"argon2-cffi==21.3.0",
	"argon2-cffi-bindings==21.2.0",
	"asyncpg==0.27.0",
	"cffi==1.15.1",
	"click==8.1.3",
	"croniter==2.0.2",
	"h11==0.14.0",
	"pycparser==2.21",
	"pyhumps==3.8.0",
	"PyYAML==6.0",
	"uvicorn==0.22.0",
	"uvloop==0.17.0",
	"watchdog==3.0.0"
]
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["framework", "asgi", "api"]
license = {text = "MIT"}
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3 :: Only",
]

[project.urls]
"Homepage" = "https://github.com/vottini/pavao"

[tool.setuptools]
packages = [ "pavao" ]
