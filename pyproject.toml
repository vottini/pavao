
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pavao"
version = "0.9.0"
description = "Modular, injection based ASGI web framework"
authors = [
	{ name = "Gustavo Venturini", email = "gustavo.c.venturini@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
	"aiosqlite==0.20.0",
	"click==8.1.3",
	"croniter==2.0.2",
	"h11==0.14.0",
	"python-dateutil==2.9.0.post0",
	"pytz==2024.2",
	"PyYAML==6.0.2",
	"six==1.16.0",
	"typing_extensions==4.12.2",
	"uvicorn==0.30.6",
	"uvloop==0.20.0",
	"watchdog==4.0.2",
	"jsonbp==1.1.1"
]
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["framework", "asgi", "api"]
license = {text = "MIT"}
classifiers = [
	"Development Status :: 2 - Pre-Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3 :: Only",
]

[project.urls]
"Homepage" = "https://github.com/vottini/pavao"

