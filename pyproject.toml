
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pavao*"]

[project]
name = "pavao"
version = "0.10.1"
description = "Modular, injection based, Python ASGI web framework"
authors = [
	{ name = "Gustavo Venturini", email = "gustavo.c.venturini@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
	"aiosqlite==0.20.0",
	"click==8.1.7",
	"croniter==3.0.3",
	"h11==0.14.0",
	"python-dateutil==2.9.0.post0",
	"pytz==2024.2",
	"PyYAML==6.0.2",
	"six==1.16.0",
	"typing_extensions==4.12.2",
	"uvicorn==0.30.6",
	"watchdog==4.0.2",
	"jsonbp==1.3.1",
	"umapper==0.1.6"
]
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["framework", "asgi", "api", "web", "rest", "http", "dependency-injection", "server-sent-events"]
license = "MIT"
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3 :: Only",
	"Topic :: Internet :: WWW/HTTP :: HTTP Servers",
	"Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
	"Topic :: Software Development :: Libraries :: Application Frameworks",
	"Framework :: AsyncIO",
]

[project.scripts]
pavao-run = "pavao.run:main"
pavao-pkg = "pavao.pkg:main"

[project.urls]
"Homepage" = "https://github.com/vottini/pavao"

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.coverage.run]
omit = ["/tmp/*", "tests/*", ".env/*"]

[tool.coverage.report]
omit = ["/tmp/*", "tests/*", ".env/*"]

